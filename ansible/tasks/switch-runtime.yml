---
- name: Stop verified opposite Docker runtime after candidate validation
  ansible.builtin.include_role:
    name: xray_cleanup
  when: xray_deployment_mode != 'docker' and xray_existing.docker_exists

- name: Stop and disable verified opposite native runtime after candidate validation
  ansible.builtin.systemd_service:
    name: xray
    state: stopped
    enabled: false
  when: xray_deployment_mode != 'native' and xray_existing.native_exists

- name: Stop and disable verified opposite Podman service after candidate validation
  ansible.builtin.systemd_service:
    name: xray-podman
    state: stopped
    enabled: false
  when: xray_deployment_mode != 'podman' and xray_existing.podman_unit_exists | default(false)

- name: Require free IPv4 and IPv6 service port before switch or fresh deployment
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import socket, sys, errno
        for family, address in [(socket.AF_INET, '0.0.0.0'), (socket.AF_INET6, '::')]:
            try:
                with socket.socket(family, socket.SOCK_STREAM) as probe:
                    if family == socket.AF_INET6:
                        probe.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 1)
                    probe.bind((address, int(sys.argv[1])))
            except OSError as error:
                if error.errno not in [errno.EAFNOSUPPORT, errno.EADDRNOTAVAIL]:
                    raise
      - "{{ xray_host_port }}"
  changed_when: false
  register: xray_port_probe
  until: xray_port_probe.rc == 0
  retries: 5
  delay: 1
  when: >-
    not ((xray_existing.native_running and xray_existing.native_port == (xray_host_port | int))
    if xray_deployment_mode == 'native' else
    ((xray_existing.podman_running | default(false) and (xray_host_port | int) in xray_existing.podman_ports)
    if xray_deployment_mode == 'podman' else
    (xray_existing.docker_running and (xray_host_port | int) in xray_existing.docker_ports)))
