---
- name: Prepare reviewed binary on controller for direct Ansible usage
  when: xray_binary_source | length == 0
  block:
    - name: Create controller artifact directory
      ansible.builtin.tempfile:
        state: directory
        prefix: xray-controller-
      delegate_to: localhost
      become: false
      register: xray_controller_directory

    - name: Download verify and extract official binary on controller
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../scripts/prepare-native.py"
          - --version
          - "{{ xray_binary_version }}"
          - --directory
          - "{{ xray_controller_directory.path }}"
          - --json
      delegate_to: localhost
      become: false
      register: xray_controller_artifact
      changed_when: false

    - name: Select controller verified artifact
      ansible.builtin.set_fact:
        xray_binary_source: "{{ (xray_controller_artifact.stdout | from_json).path }}"
        xray_binary_sha256: "{{ (xray_controller_artifact.stdout | from_json).sha256 }}"

- name: Require verified runner artifact
  ansible.builtin.assert:
    that:
      - xray_binary_source | length > 0
      - xray_binary_sha256 is match('^[a-f0-9]{64}$')
      - xray_binary_sha256 == xray_reviewed_binary_sha256[xray_binary_version]

- name: Require supported binary architecture
  ansible.builtin.command: uname -m
  register: xray_architecture
  changed_when: false
  failed_when: xray_architecture.stdout != 'x86_64'

- name: Require completed infrastructure bootstrap
  ansible.builtin.command: test -f /var/lib/proxy-bootstrap/complete
  changed_when: false

- name: Create dedicated Xray group
  ansible.builtin.group:
    name: xray
    system: true

- name: Create dedicated Xray user
  ansible.builtin.user:
    name: xray
    group: xray
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create private configuration directory
  ansible.builtin.file:
    path: "{{ xray_config_path }}"
    state: directory
    owner: root
    group: xray
    mode: "0750"

- name: Inspect installed binary checksum
  ansible.builtin.stat:
    path: "{{ xray_binary_path }}"
    checksum_algorithm: sha256
  register: xray_installed

- name: Select existing verified binary or a staged upgrade
  ansible.builtin.set_fact:
    xray_candidate_path: "{{ xray_binary_path if (xray_installed.stat.checksum | default('')) == xray_binary_sha256 else xray_binary_path + '.candidate' }}"

- name: Stage verified binary
  ansible.builtin.copy:
    src: "{{ xray_binary_source }}"
    dest: "{{ xray_binary_path }}.candidate"
    owner: root
    group: root
    mode: "0755"
  when: xray_candidate_path != xray_binary_path

- name: Verify copied binary digest
  ansible.builtin.stat:
    path: "{{ xray_candidate_path }}"
    checksum_algorithm: sha256
  register: xray_candidate

- name: Require copied artifact integrity
  ansible.builtin.assert:
    that: xray_candidate.stat.checksum == xray_binary_sha256

- name: Stage and validate configuration before activation
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/config.json.j2"
    dest: "{{ xray_config_path }}/config.candidate.json"
    owner: root
    group: xray
    mode: "0640"
    validate: "{{ xray_candidate_path }} run -format json -test -config %s"
  no_log: true

- name: Validate candidate pair even when templates are unchanged
  ansible.builtin.command:
    argv:
      - "{{ xray_candidate_path }}"
      - run
      - -format
      - json
      - -test
      - -config
      - "{{ xray_config_path }}/config.candidate.json"
  changed_when: false
  no_log: true

- name: Activate native runtime with switch recovery
  block:
    - name: Stop opposite runtime only after candidate pair passed validation
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/switch-runtime.yml"

    - name: Activate validated binary
      ansible.builtin.copy:
        remote_src: true
        src: "{{ xray_binary_path }}.candidate"
        dest: "{{ xray_binary_path }}"
        owner: root
        group: root
        mode: "0755"
      register: xray_native_binary
      when: xray_candidate_path != xray_binary_path

    - name: Enforce installed binary ownership and permissions
      ansible.builtin.file:
        path: "{{ xray_binary_path }}"
        owner: root
        group: root
        mode: "0755"

    - name: Activate validated configuration
      ansible.builtin.copy:
        remote_src: true
        src: "{{ xray_config_path }}/config.candidate.json"
        dest: "{{ xray_config_path }}/{{ xray_config_file }}"
        owner: root
        group: xray
        mode: "0640"
      no_log: true
      register: xray_native_config

    - name: Install systemd service
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/xray.service.j2"
        dest: /etc/systemd/system/xray.service
        owner: root
        group: root
        mode: "0644"
      register: xray_native_unit

    - name: Enable and reconcile native service only when changed
      ansible.builtin.systemd_service:
        name: xray
        enabled: true
        state: "{{ 'restarted' if (xray_native_binary.changed or xray_native_config.changed or xray_native_unit.changed) else 'started' }}"
        daemon_reload: "{{ xray_native_unit.changed }}"

    - name: Wait for listener without fixed sleep
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ xray_host_port }}"
        timeout: 30

    - name: Require active service
      ansible.builtin.command: systemctl is-active xray
      changed_when: false

  rescue:
    - name: Restore previous opposite runtime
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/restore-opposite.yml"

- name: Remove staging files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ xray_binary_path }}.candidate"
    - "{{ xray_config_path }}/config.candidate.json"

- name: Stop Xray explicitly
  ansible.builtin.systemd_service:
    name: xray
    state: stopped
  tags: [never, xray_down]

- name: Restart Xray explicitly
  ansible.builtin.systemd_service:
    name: xray
    state: restarted
  tags: [never, xray_reload, xray_recreate]

- name: Remove direct deployment controller artifact
  ansible.builtin.file:
    path: "{{ xray_controller_directory.path }}"
    state: absent
  delegate_to: localhost
  become: false
  when: xray_controller_directory.path is defined
