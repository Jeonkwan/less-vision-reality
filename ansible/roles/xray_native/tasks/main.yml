---
- name: Require verified runner artifact
  ansible.builtin.assert:
    that:
      - xray_binary_source | length > 0
      - xray_binary_sha256 is match('^[a-f0-9]{64}$')

- name: Require supported binary architecture
  ansible.builtin.command: uname -m
  register: xray_architecture
  changed_when: false
  failed_when: xray_architecture.stdout != 'x86_64'

- name: Require completed infrastructure bootstrap
  ansible.builtin.command: test -f /var/lib/proxy-bootstrap/complete
  changed_when: false

- name: Create dedicated Xray group
  ansible.builtin.group:
    name: xray
    system: true

- name: Create dedicated Xray user
  ansible.builtin.user:
    name: xray
    group: xray
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create private configuration directory
  ansible.builtin.file:
    path: "{{ xray_config_path }}"
    state: directory
    owner: root
    group: xray
    mode: "0750"

- name: Inspect installed binary checksum
  ansible.builtin.stat:
    path: "{{ xray_binary_path }}"
    checksum_algorithm: sha256
  register: xray_installed

- name: Select existing verified binary or a staged upgrade
  ansible.builtin.set_fact:
    xray_candidate_path: "{{ xray_binary_path if (xray_installed.stat.checksum | default('')) == xray_binary_sha256 else xray_binary_path + '.candidate' }}"

- name: Stage verified binary
  ansible.builtin.copy:
    src: "{{ xray_binary_source }}"
    dest: "{{ xray_binary_path }}.candidate"
    owner: root
    group: root
    mode: "0755"
  when: xray_candidate_path != xray_binary_path

- name: Verify copied binary digest
  ansible.builtin.stat:
    path: "{{ xray_candidate_path }}"
    checksum_algorithm: sha256
  register: xray_candidate

- name: Require copied artifact integrity
  ansible.builtin.assert:
    that: xray_candidate.stat.checksum == xray_binary_sha256

- name: Stage and validate configuration before activation
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/config.json.j2"
    dest: "{{ xray_config_path }}/config.candidate.json"
    owner: root
    group: xray
    mode: "0640"
    validate: "{{ xray_candidate_path }} run -format json -test -config %s"
  no_log: true

- name: Validate candidate pair even when templates are unchanged
  ansible.builtin.command:
    argv:
      - "{{ xray_candidate_path }}"
      - run
      - -format
      - json
      - -test
      - -config
      - "{{ xray_config_path }}/config.candidate.json"
  changed_when: false
  no_log: true

- name: Activate validated binary
  ansible.builtin.copy:
    remote_src: true
    src: "{{ xray_binary_path }}.candidate"
    dest: "{{ xray_binary_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart Xray
  when: xray_candidate_path != xray_binary_path

- name: Activate validated configuration
  ansible.builtin.copy:
    remote_src: true
    src: "{{ xray_config_path }}/config.candidate.json"
    dest: "{{ xray_config_path }}/{{ xray_config_file }}"
    owner: root
    group: xray
    mode: "0640"
  no_log: true
  notify: Restart Xray

- name: Install systemd service
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/xray.service.j2"
    dest: /etc/systemd/system/xray.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Xray

- name: Apply changed service
  ansible.builtin.meta: flush_handlers

- name: Enable and start Xray
  ansible.builtin.systemd_service:
    name: xray
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for listener without fixed sleep
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ xray_host_port }}"
    timeout: 30

- name: Require active service
  ansible.builtin.command: systemctl is-active xray
  changed_when: false

- name: Remove staging files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ xray_binary_path }}.candidate"
    - "{{ xray_config_path }}/config.candidate.json"

- name: Stop Xray explicitly
  ansible.builtin.systemd_service:
    name: xray
    state: stopped
  tags: [never, xray_down]

- name: Restart Xray explicitly
  ansible.builtin.systemd_service:
    name: xray
    state: restarted
  tags: [never, xray_reload, xray_recreate]
