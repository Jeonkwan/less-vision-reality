---
- name: Create private Docker deployment directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: ["{{ xray_service_root }}", "{{ xray_config_path }}"]

- name: Mark inspected Docker deployment ownership
  ansible.builtin.copy:
    dest: /opt/xray/.managed-by-less-vision-reality
    content: "less-vision-reality selectable-runtime v1\n"
    owner: root
    group: root
    mode: "0600"

- name: Pull reviewed official image without changing serving container
  ansible.builtin.command:
    argv: [docker, pull, "{{ xray_container_image }}"]
  register: xray_image_pull
  changed_when: "'Downloaded newer image' in xray_image_pull.stdout"

- name: Render private Docker candidate configuration
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/config.json.j2"
    dest: "{{ xray_service_root }}/config.candidate.json"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Validate Docker candidate without publishing ports
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - none
      - --mount
      - "type=bind,src={{ xray_service_root }}/config.candidate.json,dst=/candidate.json,readonly"
      - "{{ xray_container_image }}"
      - run
      - -test
      - -config
      - /candidate.json
  changed_when: false
  no_log: true

- name: Render candidate Compose definition
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/docker-compose.yml.j2"
    dest: "{{ xray_service_root }}/compose.candidate.yml"
    owner: root
    group: root
    mode: "0600"

- name: Validate candidate Compose syntax
  ansible.builtin.command:
    argv: [docker, compose, --project-name, xray, -f, /opt/xray/compose.candidate.yml, config, --quiet]
  changed_when: false

- name: Activate Docker runtime with switch recovery
  block:
    - name: Stop opposite runtime only after candidates passed validation
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/switch-runtime.yml"

    - name: Activate validated Docker configuration
      ansible.builtin.copy:
        remote_src: true
        src: "{{ xray_service_root }}/config.candidate.json"
        dest: "{{ xray_config_path }}/{{ xray_config_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      register: xray_docker_config

    - name: Activate validated Compose definition
      ansible.builtin.copy:
        remote_src: true
        src: "{{ xray_service_root }}/compose.candidate.yml"
        dest: "{{ xray_compose_file }}"
        owner: root
        group: root
        mode: "0600"

    - name: Reconcile only the managed Compose service
      ansible.builtin.command:
        argv: "{{ ['docker', 'compose', '--project-name', 'xray', '-f', xray_compose_file, 'up', '-d', '--no-deps'] + (['--force-recreate'] if xray_docker_config.changed else []) + ['xray'] }}"
      register: xray_compose_up
      changed_when: "'Created' in xray_compose_up.stderr or 'Started' in xray_compose_up.stderr or 'Recreated' in xray_compose_up.stderr"

    - name: Wait for selected Docker listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ xray_host_port }}"
        timeout: 30

    - name: Require stable running Docker container
      ansible.builtin.command:
        argv: [docker, inspect, "--format={{ '{{.State.Running}} {{.State.Restarting}} {{.RestartCount}}' }}", xray]
      register: xray_docker_state
      changed_when: false
      until: xray_docker_state.stdout.split()[:2] == ['true', 'false']
      retries: 5
      delay: 3
  rescue:
    - name: Restore previous opposite runtime
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/restore-opposite.yml"

- name: Remove Docker staging files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: [/opt/xray/config.candidate.json, /opt/xray/compose.candidate.yml]

- name: Stop only selected Docker service explicitly
  ansible.builtin.command:
    argv: [docker, compose, --project-name, xray, -f, /opt/xray/docker-compose.yml, stop, xray]
  tags: [never, xray_down]

- name: Restart only selected Docker service explicitly
  ansible.builtin.command:
    argv: [docker, compose, --project-name, xray, -f, /opt/xray/docker-compose.yml, restart, xray]
  tags: [never, xray_reload]

- name: Recreate only selected Docker service explicitly
  ansible.builtin.command:
    argv: [docker, compose, --project-name, xray, -f, /opt/xray/docker-compose.yml, up, -d, --no-deps, --force-recreate, xray]
  tags: [never, xray_recreate]
