---
# Shared settings; runtime paths and reviewed versions remain explicit.
#
# Sensitive values (UUIDs, short IDs, keys) should be injected via
# Ansible Vault, `--extra-vars`, or environment variables. For example:
#   ansible-playbook -i inventory.yml site.yml \
#     -e xray_uuid=$XRAY_UUID \
#     -e "xray_short_ids=$XRAY_SHORT_IDS" \
#     -e xray_reality_private_key=$XRAY_PRIVATE_KEY \
#     -e xray_reality_public_key=$XRAY_PUBLIC_KEY
#
# When environment variables are provided they override the defaults below.

xray_deployment_mode: "{{ lookup('env', 'XRAY_DEPLOYMENT_MODE') | default('native', true) }}"
xray_allow_runtime_switch: false
xray_binary_version: "{{ lookup('env', 'XRAY_VERSION') | default('26.3.27', true) }}"
xray_container_image_version: "{{ lookup('env', 'XRAY_CONTAINER_IMAGE_VERSION') | default('26.3.27', true) }}"
xray_container_image: "ghcr.io/xtls/xray-core:{{ xray_container_image_version }}"
xray_service_name: xray
xray_service_root: /opt/xray
xray_compose_file: /opt/xray/docker-compose.yml
xray_compose_project: xray
xray_container_confdir: /usr/local/etc/xray
xray_restart_policy: unless-stopped
xray_compose_environment: {}
xray_compose_networks: []
xray_podman_root: /opt/xray-podman
xray_podman_service: xray-podman
xray_config_path: "{{ '/usr/local/etc/xray' if xray_deployment_mode == 'native' else ('/opt/xray-podman/config' if xray_deployment_mode == 'podman' else '/opt/xray/config') }}"
xray_config_file: config.json
xray_reviewed_binary_sha256:
  "25.10.15": 1d6b0fb6f2348683d59304c9f0bbf3611daa068527159b749374f12da252e78c
  "26.3.27": 8255dd939c34cf966cc91517b6324dd3c8d0bcf49ffac8beca049a38c46845ed
xray_binary_path: /usr/local/bin/xray
xray_binary_source: "{{ lookup('env', 'XRAY_BINARY_PATH') }}"
xray_binary_sha256: "{{ lookup('env', 'XRAY_BINARY_SHA256') }}"
xray_container_port: 443
xray_host_port: 443

xray_uuid: "{{ lookup('env', 'XRAY_UUID') | default('00000000-0000-4000-8000-000000000000', true) }}"
xray_short_ids_env: "{{ lookup('env', 'XRAY_SHORT_IDS') | default('', true) }}"
xray_short_ids: >-
  {{
    (xray_short_ids_env.split(',') | map('trim') | reject('equalto', '') | list)
    if xray_short_ids_env | length > 0
    else ['a1b2c3d4']
  }}
xray_reality_private_key: "{{ lookup('env', 'XRAY_PRIVATE_KEY') | default('REPLACE_WITH_PRIVATE_KEY', true) }}"
xray_reality_public_key: "{{ lookup('env', 'XRAY_PUBLIC_KEY') | default('REPLACE_WITH_PUBLIC_KEY', true) }}"
# Optional Server Name Indication value for Reality handshakes.
# When omitted or empty, the deployment falls back to the default decoy domain `web.wechat.com`.
xray_sni: "{{ lookup('env', 'XRAY_SNI') | default('', true) }}"
