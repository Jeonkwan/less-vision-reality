# One-use owner-authorized read-only diagnostic; remove after queueing.
name: Authorized Americano journal measurement and peer check
'on':
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  measure:
    if: github.event.pull_request.number == 23 && github.event.pull_request.head.ref == 'feature/selectable-xray-runtime' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: flatwhite
    timeout-minutes: 10
    env:
      SSH_PRIVATE_KEY: ${{ secrets.HOST_SSH_PRIVATE_KEY }}
      XRAY_UUID: ${{ secrets.XRAY_UUID }}
      XRAY_SHORT_IDS: ${{ secrets.XRAY_SHORT_IDS }}
      XRAY_PUBLIC_KEY: ${{ secrets.XRAY_PUBLIC_KEY }}
    steps:
    - uses: actions/checkout@v4
    - name: Read allocated journal storage and effective configuration
      run: |
        python3 - <<'PYCODE'
        import os,pathlib,shlex,subprocess,tempfile
        code="import pathlib,json,subprocess; files=[p for p in pathlib.Path('/var/log/journal').rglob('*') if p.is_file()]; print(json.dumps([dict(name=p.name,logical=p.stat().st_size,allocated=p.stat().st_blocks*512) for p in files])); print('TOTAL_LOGICAL',sum(p.stat().st_size for p in files),'TOTAL_ALLOCATED',sum(p.stat().st_blocks*512 for p in files)); print(subprocess.check_output(['journalctl','--disk-usage'],text=True)); print(subprocess.check_output(['systemd-analyze','cat-config','systemd/journald.conf'],text=True))"
        with tempfile.TemporaryDirectory() as tmp:
          key=pathlib.Path(tmp)/'key'; key.write_text(os.environ['SSH_PRIVATE_KEY'].strip()+'\n'); key.chmod(0o600)
          subprocess.run(['ssh','-i',str(key),'-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','ConnectTimeout=10','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+tmp+'/known_hosts','ubuntu@18.136.230.110','sudo -n python3 -c '+shlex.quote(code)],check=True)
        PYCODE
    - run: bash scripts/install-test-clients.sh
    - run: python3 scripts/check-native-clients.py --nodes flatwhite decaf
