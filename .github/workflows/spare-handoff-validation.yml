# Temporary one-use handoff. Remove from the branch once its run is queued.
name: Authorized Americano spare acceptance handoff
'on':
  pull_request:
    types: [synchronize]
permissions:
  contents: read
concurrency:
  group: native-validation-americano
  cancel-in-progress: false
jobs:
  americano:
    if: github.event.pull_request.number == 23 && github.event.pull_request.head.ref == 'feature/selectable-xray-runtime' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: flatwhite
    timeout-minutes: 40
    env:
      TARGET: americano
      ADDRESS: 18.136.230.110
      VALIDATION_HOSTNAME: americano.18.136.230.110.sslip.io
      XRAY_DEPLOYMENT_MODE: native
      SPARE_RESUME: "true"
      SSH_PRIVATE_KEY: ${{ secrets.HOST_SSH_PRIVATE_KEY }}
      XRAY_UUID: ${{ secrets.XRAY_UUID }}
      XRAY_SHORT_IDS: ${{ secrets.XRAY_SHORT_IDS }}
      XRAY_PRIVATE_KEY: ${{ secrets.XRAY_PRIVATE_KEY }}
      XRAY_PUBLIC_KEY: ${{ secrets.XRAY_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ansible-core==2.16.19
      - run: bash scripts/install-test-clients.sh
      - run: python3 scripts/spare-validation.py
