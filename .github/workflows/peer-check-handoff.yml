# One-use post-cleanup read-only check; remove after queueing.
name: Authorized post-cleanup serving peer checks
'on':
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  clients:
    if: github.event.pull_request.number == 23 && github.event.pull_request.head.ref == 'feature/selectable-xray-runtime' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: flatwhite
    timeout-minutes: 5
    env:
      XRAY_UUID: ${{ secrets.XRAY_UUID }}
      XRAY_SHORT_IDS: ${{ secrets.XRAY_SHORT_IDS }}
      XRAY_PUBLIC_KEY: ${{ secrets.XRAY_PUBLIC_KEY }}
    steps:
    - uses: actions/checkout@v4
    - run: bash scripts/install-test-clients.sh
    - name: Authenticate both supplied clients by peer IP and hostname
      run: |
        python3 - <<'PYCODE'
        import subprocess
        for node,address in [('flatwhite','54.179.39.30'),('decaf','52.74.81.140')]:
          subprocess.run(['python3','scripts/check-native-clients.py','--nodes',node,'--address',address],check=True)
          subprocess.run(['python3','scripts/check-native-clients.py','--nodes',node],check=True)
        PYCODE
