name: Xray runtime validation
run-name: 'Native validation: ${{ inputs.stage }} ${{ inputs.target }}'
'on':
  workflow_dispatch:
    inputs:
      deployment_mode:
        type: choice
        options: [native, docker]
        default: native
        required: true
      require_minimal_host:
        type: boolean
        default: false
        description: Assert Docker absent on a freshly provisioned native host
      environment:
        type: environment
        required: true
        description: Environment containing the selected node credentials
      target:
        type: choice
        options:
        - cream
        - flatwhite
        - decaf
        default: cream
        required: true
      stage:
        type: choice
        options:
        - ready
        - bootstrap
        - clients
        - inspect
        - baseline
        - compare
        - reboot
        - recovery
        - logs
        - suite
        default: clients
        required: true
      address:
        type: string
        required: true
        description: Expected static IP
concurrency:
  group: native-validation-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    env:
      SSH_PRIVATE_KEY: ${{ secrets.HOST_SSH_PRIVATE_KEY }}
      XRAY_UUID: ${{ secrets.XRAY_UUID }}
      XRAY_PUBLIC_KEY: ${{ secrets.XRAY_PUBLIC_KEY }}
      XRAY_SHORT_IDS: ${{ secrets.XRAY_SHORT_IDS }}
      XRAY_REQUIRE_MINIMAL_HOST: ${{ inputs.require_minimal_host }}
      XRAY_DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
      TARGET: ${{ inputs.target }}
      STAGE: ${{ inputs.stage }}
      ADDRESS: ${{ inputs.address }}
    steps:
    - uses: actions/checkout@v4
    - name: Install verified test clients on runner
      run: bash scripts/install-test-clients.sh
    - name: Validate selected host and supplied client profiles
      run: python3 scripts/native-validation.py
