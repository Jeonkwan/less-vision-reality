name: Validate disposable Flat White
run-name: 'Flat White disposable validation: ${{ inputs.stage }}'
'on':
  workflow_dispatch:
    inputs:
      stage:
        description: Validation stage
        type: choice
        required: true
        options:
        - ready
        - validate
        - check
        - reboot
        - monitor
        - inspect
        default: ready
      expected_ip:
        description: Guarded Flat White static IP
        type: string
        required: true
        default: 3.1.225.76
permissions:
  contents: read
concurrency:
  group: flatwhite-disposable-${{ inputs.stage }}
  cancel-in-progress: false
jobs:
  diagnose:
    if: ${{ inputs.stage != 'monitor' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: flatwhite
    env:
      SSH_PRIVATE_KEY: ${{ secrets.HOST_SSH_PRIVATE_KEY }}
      XRAY_UUID: ${{ secrets.XRAY_UUID }}
      XRAY_PUBLIC_KEY: ${{ secrets.XRAY_PUBLIC_KEY }}
      XRAY_SHORT_IDS: ${{ secrets.XRAY_SHORT_IDS }}
      XRAY_PRIVATE_KEY: ${{ secrets.XRAY_PRIVATE_KEY }}
      EXPECTED_IP: ${{ inputs.expected_ip }}
      STAGE: ${{ inputs.stage }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned sing-box client
      shell: bash
      run: "set -euo pipefail\ncd \"$RUNNER_TEMP\"\ncurl --fail --silent --show-error\
        \ --location --max-time 90 \\\n  https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-linux-amd64.tar.gz\
        \ \\\n  --output sing-box.tar.gz\necho '0bb762ef286b36c2016d9107fc1f089be7a75f6d579b33f067d31e696c05927e\
        \  sing-box.tar.gz' | sha256sum --check\ntar -xzf sing-box.tar.gz\necho \"\
        $RUNNER_TEMP/sing-box-1.11.4-linux-amd64\" >> \"$GITHUB_PATH\"\n"
    - name: Wait for guarded fresh Flat White bootstrap completion
      shell: bash
      run: "set -euo pipefail\n[ \"$EXPECTED_IP\" = 3.1.225.76 ]\nkey_dir=$(mktemp\
        \ -d \"$RUNNER_TEMP/flatwhite-ssh.XXXXXX\")\nchmod 700 \"$key_dir\"\nprintf\
        \ '%s\\n' \"$SSH_PRIVATE_KEY\" > \"$key_dir/key\"\nchmod 600 \"$key_dir/key\"\
        \necho \"KEY_DIR=$key_dir\" >> \"$GITHUB_ENV\"\nconnected=false\nfor attempt\
        \ in $(seq 1 90); do\n if python3 - <<'DNS'\nimport socket,os\nassert {x[4][0]\
        \ for x in socket.getaddrinfo('flatwhite.mokamaker.site',22,type=socket.SOCK_STREAM)}=={os.environ['EXPECTED_IP']}\n\
        DNS\n then\n  if timeout 25 ssh -i \"$key_dir/key\" -o BatchMode=yes -o IdentitiesOnly=yes\
        \ -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=\"\
        $key_dir/known_hosts\" ubuntu@flatwhite.mokamaker.site \"if [ '$STAGE' = inspect\
        \ ]; then uname -r; else test -f /var/lib/proxy-bootstrap/complete && grep\
        \ -qw kho=off /proc/cmdline && uname -r; fi\"; then\n   connected=true;break\n\
        \  fi\n fi\n echo \"Waiting for completed bootstrap/DNS/SSH, attempt $attempt\"\
        \n sleep 10\ndone\n[ \"$connected\" = true ]\n"
    - name: Inspect bootstrap failure without modifying host
      if: ${{ inputs.stage == 'inspect' }}
      shell: bash
      run: 'set -euo pipefail

        ssh -i "$KEY_DIR/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10
        -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KEY_DIR/known_hosts"
        ubuntu@flatwhite.mokamaker.site ''uname -r; cat /proc/cmdline; free -h; sudo
        -n cloud-init status; sudo -n systemctl status proxy-bootstrap.service --no-pager
        || true; sudo -n journalctl -u proxy-bootstrap.service --no-pager -n 50; sudo
        -n tail -60 /var/log/cloud-init-output.log; sudo -n ls -la /var/lib/proxy-bootstrap;
        sudo -n systemctl list-timers --all --no-pager''

        '
    - name: Validate provisioning without package or kernel updates
      if: ${{ inputs.stage == 'ready' }}
      shell: bash
      run: 'set -euo pipefail

        SSH=(ssh -i "$KEY_DIR/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10
        -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KEY_DIR/known_hosts"
        ubuntu@flatwhite.mokamaker.site)

        timeout 100 "${SSH[@]}" ''POLICY_ONLY=1 bash -s'' < scripts/validation/validate-flatwhite.sh

        "${SSH[@]}" ''sudo -n cloud-init status; sudo -n systemctl status proxy-bootstrap.service
        --no-pager || true; sudo -n journalctl -u proxy-bootstrap.service --no-pager
        -n 12''

        '
    - name: Validate authenticated proxy and host
      if: ${{ inputs.stage != 'ready' && inputs.stage != 'inspect' }}
      shell: bash
      run: 'set -euo pipefail

        SSH=(ssh -i "$KEY_DIR/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10
        -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KEY_DIR/known_hosts"
        ubuntu@flatwhite.mokamaker.site)

        python scripts/diagnostics/check-proxies.py --nodes flatwhite cream decaf
        --expected-flatwhite-ip "$EXPECTED_IP"

        timeout 100 "${SSH[@]}" ''bash -s'' < scripts/validation/validate-flatwhite.sh

        '
    - name: Test log rotation with disposable container
      if: ${{ inputs.stage == 'validate' }}
      shell: bash
      run: 'set -euo pipefail

        SSH=(ssh -i "$KEY_DIR/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10
        -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KEY_DIR/known_hosts"
        ubuntu@flatwhite.mokamaker.site)

        timeout 150 "${SSH[@]}" ''bash -s'' < scripts/validation/test-log-rotation.sh

        '
    - name: Controlled reboot and post-boot proxy validation
      if: ${{ inputs.stage == 'reboot' }}
      shell: bash
      run: "set -euo pipefail\nSSH=(ssh -i \"$KEY_DIR/key\" -o BatchMode=yes -o IdentitiesOnly=yes\
        \ -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=\"\
        $KEY_DIR/known_hosts\" ubuntu@flatwhite.mokamaker.site)\nboot=$(\"${SSH[@]}\"\
        \ 'cat /proc/sys/kernel/random/boot_id')\n\"${SSH[@]}\" \"sudo -n shutdown\
        \ -r +1 'Validate disposable Flat White boot persistence'\"\nsleep 70\nrecovered=false\n\
        for attempt in $(seq 1 60); do\n next=$(timeout 20 \"${SSH[@]}\" 'cat /proc/sys/kernel/random/boot_id'\
        \ 2>/dev/null || true)\n if [ -n \"$next\" ] && [ \"$boot\" != \"$next\" ];\
        \ then\n  if timeout 100 \"${SSH[@]}\" 'bash -s' < scripts/validation/validate-flatwhite.sh;\
        \ then recovered=true;break;fi\n fi\n sleep 10\ndone\n[ \"$recovered\" = true\
        \ ]\necho \"Reboot validated: $boot -> $next\"\npython scripts/diagnostics/check-proxies.py\
        \ --nodes flatwhite cream decaf --expected-flatwhite-ip \"$EXPECTED_IP\"\n"
    - name: Remove runner SSH credentials
      if: always()
      shell: bash
      run: if [ -n "${KEY_DIR:-}" ]; then rm -rf "$KEY_DIR"; fi
  monitor1:
    uses: ./.github/workflows/flatwhite-monitor-segment.yml
    with:
      expected_ip: ${{ inputs.expected_ip }}
      segment: '1'
    secrets: inherit
    if: ${{ inputs.stage == 'monitor' }}
  monitor2:
    uses: ./.github/workflows/flatwhite-monitor-segment.yml
    with:
      expected_ip: ${{ inputs.expected_ip }}
      segment: '2'
    secrets: inherit
    needs: monitor1
  monitor3:
    uses: ./.github/workflows/flatwhite-monitor-segment.yml
    with:
      expected_ip: ${{ inputs.expected_ip }}
      segment: '3'
    secrets: inherit
    needs: monitor2
  monitor4:
    uses: ./.github/workflows/flatwhite-monitor-segment.yml
    with:
      expected_ip: ${{ inputs.expected_ip }}
      segment: '4'
    secrets: inherit
    needs: monitor3
  monitor5:
    uses: ./.github/workflows/flatwhite-monitor-segment.yml
    with:
      expected_ip: ${{ inputs.expected_ip }}
      segment: '5'
    secrets: inherit
    needs: monitor4
  monitor6:
    uses: ./.github/workflows/flatwhite-monitor-segment.yml
    with:
      expected_ip: ${{ inputs.expected_ip }}
      segment: '6'
    secrets: inherit
    needs: monitor5
