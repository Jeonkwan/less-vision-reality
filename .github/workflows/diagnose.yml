name: Inspect Flat White reboot failure
run-name: Flat White bounded startup diagnostics
permissions:
  contents: read
concurrency:
  group: proxy-diagnostics-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned sing-box client
      shell: bash
      run: "set -euo pipefail\ncd \"$RUNNER_TEMP\"\ncurl --fail --silent --show-error\
        \ --location --max-time 90 \\\n  https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-linux-amd64.tar.gz\
        \ \\\n  --output sing-box.tar.gz\necho '0bb762ef286b36c2016d9107fc1f089be7a75f6d579b33f067d31e696c05927e\
        \  sing-box.tar.gz' | sha256sum --check\ntar -xzf sing-box.tar.gz\necho \"\
        $RUNNER_TEMP/sing-box-1.11.4-linux-amd64\" >> \"$GITHUB_PATH\"\n"
    - name: Inspect hosts over SSH without changing services
      continue-on-error: true
      env:
        SSH_PRIVATE_KEY: ${{ secrets.HOST_SSH_PRIVATE_KEY }}
        SSH_USER_INPUT: ${{ inputs.ssh_user }}
        SSH_USER_DEFAULT: ${{ vars.REMOTE_SERVER_USER }}
        SSH_PORT_DEFAULT: ${{ vars.REMOTE_SERVER_PORT }}
      shell: bash
      run: "set -euo pipefail\nif [ -z \"$SSH_PRIVATE_KEY\" ]; then\n  echo 'HOST_SSH_PRIVATE_KEY\
        \ is not configured in the selected environment.'\n  exit 1\nfi\nkey_dir=$(mktemp\
        \ -d \"$RUNNER_TEMP/proxy-ssh.XXXXXX\")\ntrap 'rm -rf \"$key_dir\"' EXIT\n\
        chmod 700 \"$key_dir\"\nprintf '%s\\n' \"$SSH_PRIVATE_KEY\" > \"$key_dir/key\"\
        \nchmod 600 \"$key_dir/key\"\nssh_user=\"${SSH_USER_INPUT:-${SSH_USER_DEFAULT:-ubuntu}}\"\
        \nssh_port=\"${SSH_PORT_DEFAULT:-22}\"\nfor attempt in $(seq 1 25); do\n echo\
        \ \"Flat White SSH diagnostic attempt $attempt\"\n if ssh-keyscan -T 5 -p\
        \ \"$ssh_port\" flatwhite.mokamaker.site > \"$key_dir/known_hosts\" 2>/dev/null;\
        \ then\n   if timeout 100 ssh -i \"$key_dir/key\" -p \"$ssh_port\" -o BatchMode=yes\
        \ -o IdentitiesOnly=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=yes -o\
        \ UserKnownHostsFile=\"$key_dir/known_hosts\" \"$ssh_user@flatwhite.mokamaker.site\"\
        \ 'bash -s' < scripts/diagnostics/fast-host-readonly.sh; then\n     break\n\
        \   fi\n fi\n sleep 15\ndone\n"
    - name: Test authenticated REALITY connections from outside China
      env:
        XRAY_UUID: ${{ secrets.XRAY_UUID }}
        XRAY_PUBLIC_KEY: ${{ secrets.XRAY_PUBLIC_KEY }}
        XRAY_SHORT_IDS: ${{ secrets.XRAY_SHORT_IDS }}
        EXPECTED_IP: ${{ inputs.expected_ip }}
      shell: bash
      run: "set -euo pipefail\nfor value in \"$XRAY_UUID\" \"$XRAY_PUBLIC_KEY\" \"\
        $XRAY_SHORT_IDS\"; do\n  if [ -z \"$value\" ]; then\n    echo 'Required Xray\
        \ secret is missing in selected environment.'\n    exit 1\n  fi\n  echo \"\
        ::add-mask::$value\"\ndone\npython scripts/diagnostics/check-proxies.py --nodes\
        \ flatwhite decaf --expected-flatwhite-ip \"$EXPECTED_IP\" | tee \"$RUNNER_TEMP/client-diagnostics.txt\"\
        \n"
    - name: Publish client diagnostic summary
      if: always()
      shell: bash
      run: "if [ -f \"$RUNNER_TEMP/client-diagnostics.txt\" ]; then\n  printf '###\
        \ Read-only client diagnostics\\n\\n```text\\n' >> \"$GITHUB_STEP_SUMMARY\"\
        \n  cat \"$RUNNER_TEMP/client-diagnostics.txt\" >> \"$GITHUB_STEP_SUMMARY\"\
        \n  printf '\\n```\\n' >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
'on':
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment holding existing Xray and SSH secrets
        required: true
        default: flatwhite
        type: environment
      ssh_user:
        description: SSH username (blank uses environment variable or ubuntu)
        required: false
        default: ''
        type: string
      expected_ip:
        description: Verified new Flat White static IP
        required: true
        type: string
