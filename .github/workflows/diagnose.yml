name: Xray runtime validation
run-name: 'Runtime validation: ${{ inputs.stage }} ${{ inputs.target }} ${{ inputs.deployment_mode }}'
'on':
  workflow_dispatch:
    inputs:
      container_image_version:
        type: choice
        options: ["26.3.27", "25.10.15"]
        default: "26.3.27"
        description: Expected reviewed Docker image version
      deployment_mode:
        type: choice
        options: [native, docker]
        default: native
        required: true
      resume_spare:
        type: boolean
        default: false
        description: Resume spare acceptance after a failed attempt; fresh native footprint evidence must already exist
      require_minimal_host:
        type: boolean
        default: false
        description: Assert Docker absent on a freshly provisioned native host
      environment:
        type: environment
        required: true
        description: Environment containing the selected node credentials
      target:
        type: choice
        options:
        - cream
        - flatwhite
        - decaf
        - americano
        - latte
        default: cream
        required: true
      stage:
        type: choice
        options:
        - ready
        - bootstrap
        - clients
        - inspect
        - baseline
        - compare
        - reboot
        - recovery
        - logs
        - suite
        - validate-spare
        default: clients
        required: true
      validation_hostname:
        type: string
        required: false
        default: ""
        description: Spare name.IP.sslip.io hostname; empty uses name.mokamaker.site
      address:
        type: string
        required: true
        description: Expected static IP
concurrency:
  group: native-validation-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 40
    env:
      SSH_PRIVATE_KEY: ${{ secrets.HOST_SSH_PRIVATE_KEY }}
      SPARE_RESUME: ${{ inputs.resume_spare }}
      XRAY_PRIVATE_KEY: ${{ secrets.XRAY_PRIVATE_KEY }}
      VALIDATION_HOSTNAME: ${{ inputs.validation_hostname }}
      XRAY_UUID: ${{ secrets.XRAY_UUID }}
      XRAY_PUBLIC_KEY: ${{ secrets.XRAY_PUBLIC_KEY }}
      XRAY_SHORT_IDS: ${{ secrets.XRAY_SHORT_IDS }}
      XRAY_REQUIRE_MINIMAL_HOST: ${{ inputs.require_minimal_host }}
      XRAY_CONTAINER_IMAGE_VERSION: ${{ inputs.container_image_version }}
      XRAY_DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
      TARGET: ${{ inputs.target }}
      STAGE: ${{ inputs.stage }}
      ADDRESS: ${{ inputs.address }}
    steps:
    - uses: actions/checkout@v4
    - name: Install verified test clients on runner
      run: bash scripts/install-test-clients.sh
    - uses: actions/setup-python@v5
      if: inputs.stage == 'validate-spare'
      with:
        python-version: "3.11"
    - name: Install controller Ansible for spare deployment
      if: inputs.stage == 'validate-spare'
      run: pip install ansible-core==2.16.19
    - name: Validate selected host and supplied client profiles
      run: |
        if [ "$STAGE" = validate-spare ]; then
          python3 scripts/spare-validation.py
        else
          python3 scripts/native-validation.py
        fi
